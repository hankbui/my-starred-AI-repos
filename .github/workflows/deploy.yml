name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Update AI Repos Data", "Update Research Intelligence"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject LLM7 token into frontend
        env:
          LLM7_TOKEN: ${{ secrets.LLM7_TOKEN }}
        run: |
          sed -i "s/LLM7_TOKEN_PLACEHOLDER/$LLM7_TOKEN/g" website/agent-skills.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
